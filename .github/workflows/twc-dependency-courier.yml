name: TWC Dependency Courier
on:
  push:
    paths: ['.github/workflows/twc-dependency-courier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  courier:
    runs-on: ubuntu-latest
    env:
      CFT_VERSION: "154.0.8037.57"
    steps:
      - name: Fetch Chrome for Testing headless shell
        run: |
          set -euxo pipefail
          URL="https://storage.googleapis.com/chrome-for-testing-public/$CFT_VERSION/linux64/chrome-headless-shell-linux64.zip"
          curl -fL --retry 3 "$URL" -o "$RUNNER_TEMP/headless-shell.zip"
          unzip -q "$RUNNER_TEMP/headless-shell.zip" -d "$RUNNER_TEMP/headless-shell"
          test -x "$RUNNER_TEMP/headless-shell/chrome-headless-shell-linux64/chrome-headless-shell"
          "$RUNNER_TEMP/headless-shell/chrome-headless-shell-linux64/chrome-headless-shell" --version
          tar -C "$RUNNER_TEMP/headless-shell" -czf "$RUNNER_TEMP/chrome-headless-shell.tgz" chrome-headless-shell-linux64
          sha256sum "$RUNNER_TEMP/chrome-headless-shell.tgz" > "$RUNNER_TEMP/chrome-headless-shell.tgz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-headless-shell-courier
          path: |
            ${{ runner.temp }}/chrome-headless-shell.tgz
            ${{ runner.temp }}/chrome-headless-shell.tgz.sha256
          if-no-files-found: error
          retention-days: 1
