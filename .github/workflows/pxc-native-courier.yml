name: PxC Native Dependency Courier
on:
  push:
    branches: ['courier/pxc-fg-deps-20261004']
    paths: ['.github/workflows/pxc-native-courier.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Bundle pinned native test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps" "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/deps"
          printf '%s\n' '{"private":true,"dependencies":{"@napi-rs/canvas":"1.0.9","jszip":"3.10.1"}}' > package.json
          npm install --ignore-scripts --no-audit --no-fund
          node -e 'const c=require("@napi-rs/canvas"); if(!c.createCanvas(2,2).toBuffer("image/png").length)process.exit(1); require("jszip");'
          npm ls --all --json > dependency-tree.json
          tar -czf "$RUNNER_TEMP/out/pxc-native-deps.tgz" node_modules package-lock.json dependency-tree.json
          cd "$RUNNER_TEMP/out"
          sha256sum pxc-native-deps.tgz > SHA256SUMS
          printf '{"run":"%s","commit":"%s","node":"22.16.0","scope":"dependency transport only"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > courier.json
      - uses: actions/upload-artifact@v4
        with:
          name: pxc-native-deps-linux-x64
          path: ${{ runner.temp }}/out/
          retention-days: 7
