name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract prebuilt Pages artifact
        run: |
          unzip -t pages-artifact.zip
          mkdir -p "$RUNNER_TEMP/pages"
          unzip -q pages-artifact.zip -d "$RUNNER_TEMP/pages"
          test -f "$RUNNER_TEMP/pages/index.html"
          test -f "$RUNNER_TEMP/pages/.nojekyll"
          python3 - "$RUNNER_TEMP/pages/BUILD_INFO.json" <<'PY'
          import json
          import sys
          info = json.load(open(sys.argv[1], encoding='utf-8'))
          assert info['artifact'] == 'discstudio-tournament-pages' and info['static'] is True and info['buildId']
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
