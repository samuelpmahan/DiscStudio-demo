name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Lane stoplight: runs stoplight/items.json and publishes it at /stoplight/ on this site.
  # Delta: results whose inputs are unchanged since the published run are reused.
  # Read-only job; it can never block or alter the DiscStudio deploy.
  stoplight:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run stoplight
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stoplight/stoplight.json
        run: |
          curl -fsSL "$PREVIOUS_URL" -o "$RUNNER_TEMP/previous-stoplight.json" || echo "No published stoplight yet; running everything."
          STOPLIGHT_PREVIOUS="$RUNNER_TEMP/previous-stoplight.json" node --experimental-strip-types --no-warnings stoplight/run.ts | tee "$RUNNER_TEMP/stoplight.txt"
          { echo '## Lane stoplight'; echo '```'; cat "$RUNNER_TEMP/stoplight.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stoplight
          path: |
            stoplight/index.html
            stoplight/stoplight.json

  stage:
    needs: stoplight
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract prebuilt Pages artifact
        run: |
          unzip -t pages-artifact.zip
          mkdir -p "$RUNNER_TEMP/pages"
          unzip -q pages-artifact.zip -d "$RUNNER_TEMP/pages"
          test -f "$RUNNER_TEMP/pages/index.html"
          test -f "$RUNNER_TEMP/pages/.nojekyll"
          python3 - "$RUNNER_TEMP/pages/BUILD_INFO.json" <<'PY'
          import json
          import sys
          info = json.load(open(sys.argv[1], encoding='utf-8'))
          assert info['artifact'] == 'discstudio-tournament-pages' and info['static'] is True and info['buildId']
          PY
      - name: Add stoplight page if it was produced
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stoplight
          path: ${{ runner.temp }}/pages/stoplight
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
