# TEMPORARY (branch stoplight-ci only; removed before merge).
# Proves the stoplight can't block the deploy: same job graph as deploy-pages.yml,
# with the stoplight forced to fail and no Pages deployment.
name: Stoplight fail-open check

on:
  push:
    branches: [stoplight-ci]

permissions:
  contents: read

jobs:
  stoplight:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Forced stoplight failure
        run: |
          echo "Intentional failure to prove the deploy still runs."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: stoplight
          path: stoplight/index.html

  stage:
    needs: stoplight
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Add stoplight page if it was produced
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: stoplight
          path: ${{ runner.temp }}/pages/stoplight
      - name: Stage reached
        run: echo "stage ran after a failed stoplight; stoplight result=${{ needs.stoplight.result }}"

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - name: Deploy reached (no deployment performed)
        run: echo "deploy job would run here"
